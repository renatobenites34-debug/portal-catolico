site:
  name: 'Oratório & Fé - Devoção e Arte Sacra'
  site: 'https://oratorioefe.com.br'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: 'Oratório & Fé - Devoção e Arte Sacra'
    template: '%s — Oratório & Fé'
  description: 'Portal católico de devoção, vida dos santos, notícias da Igreja e arte sacra. Aprofunde sua fé com artigos, orações e peças sacras selecionadas.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Oratório & Fé - Devoção e Arte Sacra'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: pt-BR
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
